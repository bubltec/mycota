packages:
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  esbuild: true
  '@bubltec/mycota-config': true
  '@bubltec/mycota-cdk': true
# Pin exact versions when adding dependencies. Kept in sync with .npmrc.
saveExact: true
# Fail (not just warn) when the running Node does not satisfy `engines` (Node 26).
# Only this setting works: pnpm 11 ignores `engine-strict` in .npmrc.
engineStrict: true
# Install native optional deps (rollup, oxlint, esbuild) for both Mac arches so
# a Rosetta Node and an arm64 Node can share the same node_modules. Without
# this, whichever arch the first install ran on is the only one that works.
supportedArchitectures:
  os:
    - current
  cpu:
    - arm64
    - x64
# @nestjs/platform-fastify (dev-only, for the auth module smoke test) pins `fastify`
# exactly; keep one copy so @fastify/cookie's type augmentation targets the same
# FastifyReply the code imports. Same override as political-sloth.
overrides:
  fastify: 5.12.5
