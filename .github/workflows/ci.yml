name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for a release from current main'
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch
          - next

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run typecheck lint build test

  # Releases are driven off the latest git tag (not a committed package.json
  # version — package.json's checked-in version is a permanent placeholder,
  # see README). Every relevant push to main publishes to npm; real semver
  # releases also get a git tag and GitHub Release. Bump level is chosen by:
  #  1. workflow_dispatch input (manual "Run workflow" in Actions)
  #  2. explicit #major/#minor/#patch/#next in the commit message
  #  3. conventional commit prefix on the subject (feat: → minor, fix: → patch)
  #  4. default → patch
  # Put explicit markers in the PR title — that's what a squash-merge commit
  # subject becomes verbatim. Use #next to opt into a rolling prerelease only.
  publish:
    needs: check
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          LATEST=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

          SUBJECT=$(git log -1 --format=%s)
          MSG=$(git log -1 --format=%B)

          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            BUMP=${{ inputs.bump }}
          elif echo "$MSG" | grep -qw '#major'; then
            BUMP=major
          elif echo "$MSG" | grep -qw '#minor'; then
            BUMP=minor
          elif echo "$MSG" | grep -qw '#patch'; then
            BUMP=patch
          elif echo "$MSG" | grep -qw '#next'; then
            BUMP=none
          elif echo "$SUBJECT" | grep -qE '^feat(\([^)]+\))?!:'; then
            BUMP=major
          elif echo "$SUBJECT" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP=minor
          elif echo "$SUBJECT" | grep -qE '^fix(\([^)]+\))?:'; then
            BUMP=patch
          else
            BUMP=patch
          fi

          if [ "$BUMP" = next ]; then
            BUMP=none
          fi

          if [ "$BUMP" = major ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"; TAG=latest
          elif [ "$BUMP" = minor ]; then
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"; TAG=latest
          elif [ "$BUMP" = patch ]; then
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"; TAG=latest
          else
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))-next.${{ github.run_number }}"; TAG=next
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - run: pnpm -r exec -- npm pkg set version="${{ steps.version.outputs.version }}"

      - run: pnpm -r publish --tag ${{ steps.version.outputs.tag }} --no-git-checks

      - name: Tag + GitHub Release (real releases only)
        if: steps.version.outputs.bump != 'none'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          gh release create "v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
